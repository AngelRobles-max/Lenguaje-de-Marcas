<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>UD3.2 - Ejercicio 2</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <h1>Alta de usuario</h1>

  <form action="#" method="post">

    <p>
      <label for="id">Identificador de usuario:</label><br>
      <input type="text" id="id" name="id" value="USR-0001" readonly>
    </p>

    <p>
      <label for="nombre">Nombre:</label><br>
      <input type="text" id="nombre" name="nombre" required>
    </p>

    <p>
      <label for="email">Email:</label><br>
      <input type="email" id="email" name="email" required>
    </p>

    <p>
      <label for="pass">Contraseña:</label><br>
      <input type="password" id="pass" name="pass" required>
    </p>

    <p>
      <label for="promo">Código promocional:</label><br>
      <input type="text" id="promo" name="promo" value="NO DISPONIBLE" disabled>
    </p>

    <p>
      Sexo:<br>
      <input type="radio" id="sexo-h" name="sexo" value="hombre"><label for="sexo-h">Hombre</label>
      <input type="radio" id="sexo-m" name="sexo" value="mujer"><label for="sexo-m">Mujer</label>
      <input type="radio" id="sexo-o" name="sexo" value="otro"><label for="sexo-o">Otro</label>
    </p>

    <p>
      Aficiones:<br>
      <input type="checkbox" id="af-musica" name="aficiones" value="musica"><label for="af-musica">Música</label>
      <input type="checkbox" id="af-deporte" name="aficiones" value="deporte"><label for="af-deporte">Deporte</label>
      <input type="checkbox" id="af-lectura" name="aficiones" value="lectura"><label for="af-lectura">Lectura</label>
    </p>

    <p>
      <input type="submit" value="Enviar">
    </p>

  </form>
</body>
</html>
